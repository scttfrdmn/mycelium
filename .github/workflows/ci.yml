name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Force bundled Node 20 actions (e.g. github-script inside
# codecov-action@v5) onto Node 24 ahead of GitHub's 2026-06-16 cutover
# (spore-host#345). These jobs run on GitHub-hosted runners.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lambda-tests:
    name: Lambda module tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: lambda/rest-api
            min_coverage: '10'   # target 60% (CLAUDE.md); current ~10.8%
          - module: lambda/spore-bot
            min_coverage: '12'   # current ~13.8%
          - module: lambda/portal-phone-home
            min_coverage: '35'   # current ~36.6%. Was 70 while the registry +
                                 # lifecycle machine lived here; both moved to
                                 # lambda/accountlifecycle, taking their coverage
                                 # with them. What's left is the SigV4 invariant
                                 # (fully covered) plus Lambda wiring that only an
                                 # integration test could reach.
          - module: lambda/accountlifecycle
            min_coverage: '85'   # current ~88.4% — the registry and the spawn#457
                                 # state machine. Pure logic plus substrate-backed
                                 # persistence tests, so a high floor is honest here.
          - module: lambda/portal-account-prober
            min_coverage: '80'   # current ~83%. probeAccount/isDenied/countManaged
                                 # are 100% and the run loop is driven through a
                                 # recording fake registry, so the writes-that-must-
                                 # not-happen assertions are real. Only init() and
                                 # the STS client factory are uncovered.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage gate
        working-directory: ${{ matrix.module }}
        env:
          MIN_COVERAGE: ${{ matrix.min_coverage }}
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "${{ matrix.module }} coverage: ${total}% (floor: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }' \
            || { echo "::error::coverage ${total}% is below floor ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          fail_ci_if_error: false

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  docs-build:
    name: Docs build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      # VitePress fails the build on a dead `@include:` transclusion or a broken
      # internal link, so building is itself the docs gate. This catches a stale
      # `docs/gen/<cli>/` include or a bad cross-page link before it deploys —
      # the docs previously had no PR gate at all.
      - name: Build docs
        working-directory: docs
        run: npm run build
